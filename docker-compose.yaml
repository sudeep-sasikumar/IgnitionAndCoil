# Ignition & Coil on a VPS (README "Running on a VPS").
# Made for Hostinger Docker Manager -> "Compose from URL" with this file's raw GitHub link:
#   https://raw.githubusercontent.com/sudeep-sasikumar/IgnitionAndCoil/master/docker-compose.yaml
# Hostinger downloads ONLY this file, so nothing here refers to other files. The image is built
# by GitHub Actions (.github/workflows/docker-image.yml) on every push; a redeploy pulls the latest.
#
# HTTPS: the VPS already runs Traefik (Hostinger's Docker Manager setup: host network, entrypoints
# web/websecure, certificate resolver "letsencrypt", exposedbydefault=false). The labels below
# ask it to route DOMAIN to the dashboard and obtain the certificate - no port is published here.
#
# Environment variables to enter in Docker Manager:
#   TELEGRAM_BOT_TOKEN   from @BotFather
#   TELEGRAM_CHAT_ID     your chat id (README "Telegram alerts")
#   DASHBOARD_PASSWORD   required - the dashboard login, pick a long one
#   DOMAIN               optional - defaults to this VPS's Hostinger hostname
services:
  scanner:
    image: ghcr.io/sudeep-sasikumar/ignitionandcoil:latest
    pull_policy: always                   # a redeploy picks up the newest image
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}   # required: without it the dashboard stays off
      # login is enforced because bind_host is not localhost; cookies only over HTTPS
      IC_OVERRIDES: "dashboard.bind_host=0.0.0.0;dashboard.open_browser=false;dashboard.cookie_secure=true;dashboard.base_url=https://${DOMAIN:-srv1479428.hstgr.cloud}"
    volumes:
      - scanner_data:/app/var             # database, live config.yaml, logs, backups
    expose:
      - "8000"                            # reached only through Traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.ignition-coil.rule=Host(`${DOMAIN:-srv1479428.hstgr.cloud}`)
      - traefik.http.routers.ignition-coil.entrypoints=websecure
      - traefik.http.routers.ignition-coil.tls=true
      - traefik.http.routers.ignition-coil.tls.certresolver=letsencrypt
      - traefik.http.services.ignition-coil.loadbalancer.server.port=8000
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  scanner_data:
